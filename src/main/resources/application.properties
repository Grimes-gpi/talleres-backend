spring.application.name=talleres-comunitarios-backend
# Render (y otras nubes) indican el puerto en PORT; en tu PC sigue siendo 8081.
server.port=${PORT:${SERVER_PORT:8081}}

# DB_URL completo, o por partes (DB_HOST, DB_PORT, DB_NAME) como lo entrega Render.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:talleres_comunitarios}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Autenticación JWT. En producción define JWT_SECRET (mínimo 32 caracteres) e INSTRUCTOR_CODE.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-talleres-comunitarios-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.auth.instructor-code=${INSTRUCTOR_CODE:INSTRUCTOR-2026}
